name: Scrape de una tienda (reutilizable)

# Lo llaman scrape-winpy.yml, scrape-pcexpress.yml y scrape-spdigital.yml.
# Cada tienda corre por separado: si una falla (por ejemplo, SP Digital en
# mantenimiento responde 503), las otras siguen corriendo y agrupando.

on:
  workflow_call:
    inputs:
      tienda:
        description: "Tienda a scrapear (winpy, pcexpress o spdigital)"
        required: true
        type: string
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SERVICE_ROLE_KEY:
        required: true

jobs:
  scrapear:
    runs-on: ubuntu-latest
    # Holgado a propósito: los crawl-delay (10 s en Winpy) hacen lenta la corrida.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Las tareas de deno.json corren con --env-file=.env, así que el archivo debe existir.
      - name: Crear scraper/.env desde los secrets
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          } > .env
      # Una regresión en el código (no un cambio del sitio: las pruebas usan HTML/JSON
      # de ejemplo) detiene el job aquí, antes de escribir en Supabase.
      - name: Pruebas de los scrapers y el agrupador
        run: deno task test
      # Ojo: en deno.json las tres categorías van unidas con ";", así que este paso
      # solo falla si falla la última categoría (gpu).
      - name: Scrapers de ${{ inputs.tienda }}
        run: deno task scrape:${{ inputs.tienda }}

  # El agrupado lee todos los productos de todas las tiendas, así que no se
  # ejecutan dos a la vez: el grupo de concurrencia "agrupar" lo comparten las
  # tres tiendas. Si hay uno corriendo y llegan otros dos, GitHub cancela el que
  # esperaba y deja el último; no se pierde nada, porque ese último agrupa todo.
  # needs: si el scrape de esta tienda falla, no se agrupa en esta corrida.
  agrupar:
    needs: scrapear
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agrupar
      cancel-in-progress: false
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Crear scraper/.env desde los secrets
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          } > .env
      - name: Agrupado
        run: deno task group

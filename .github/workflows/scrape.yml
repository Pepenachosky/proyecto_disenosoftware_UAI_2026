name: Scrape diario

on:
  schedule:
    # 07:00 UTC = 03:00/04:00 en Chile según horario de verano
    - cron: "0 7 * * *"
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Crear scraper/.env desde los secrets
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          } > .env
      - name: Pruebas de los scrapers y el agrupador
        run: deno task test
      - name: Scrapers y agrupado
        run: deno task scrape

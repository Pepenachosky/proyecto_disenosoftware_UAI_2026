name: Scrape diario - Winpy

on:
  schedule:
    # 07:40 UTC = 03:40/04:40 en Chile según horario de verano
    - cron: "40 7 * * *"
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  group: scrape-winpy
  cancel-in-progress: false

jobs:
  scrape:
    uses: ./.github/workflows/scrape-tienda.yml
    with:
      tienda: winpy
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
